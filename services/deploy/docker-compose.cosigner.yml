version: "3.8"
# ============================================================================
# Co-Signer Service (Server B) — Docker Compose
# ============================================================================
#
# Runs on a SEPARATE machine from Server A (the surrender API).
# This machine holds admin key 2 and co-signs a transaction only after
# services/cosign_policy.py has verified it as a surrender. ./data holds the
# ledger of signed payouts that enforces the caps; keep it across restarts
# and upgrades. setup-cosigner.sh creates it once; the service refuses to start
# without it.
#
# Setup:
#   1. Copy this file + .env.cosigner to the co-signer host
#   2. Place admin_2.skey in ./keys/ (NEVER let this file leave this machine)
#   3. Run: docker compose -f docker-compose.cosigner.yml up -d
#
# ============================================================================

services:
  cosigner:
    build:
      context: ../..
      dockerfile: services/deploy/Dockerfile.cosigner
    container_name: cmatra-cosigner
    restart: unless-stopped
    ports:
      - "${COSIGNER_PORT:-8421}:8421"
    env_file:
      - .env.cosigner
    volumes:
      - ./keys:/app/keys:ro
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8421/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
