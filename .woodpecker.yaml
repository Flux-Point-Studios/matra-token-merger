# One file, not a .woodpecker/ directory: main's branch protection requires the
# single status ci/woodpecker/pr/woodpecker that this file posts.
when:
  - event: [push, pull_request]
    branch: main

steps:
  - name: aiken-claim_validator
    image: debian:bookworm-slim
    commands: &aiken
      # python3: verify_build.sh hashes the fresh blueprint with it
      - apt-get update -qq && apt-get install -y -qq curl python3 >/dev/null
      - curl --proto '=https' --tlsv1.2 -LsSf https://install.aiken-lang.org | sh
      - export PATH="$HOME/.aiken/bin:$PATH"
      # v1.1.21 is the audited compiler; the committed blueprints and the
      # verify_build.sh hash pins are only reproducible under it
      - aikup install v1.1.21
      - aiken --version
      - cd $${VALIDATOR}
      - aiken check
      - cp -f plutus.json plutus.committed.json
      - aiken build
      - diff -u plutus.committed.json plutus.json   # drift gate: committed blueprint must equal a fresh build
      - rm -f plutus.committed.json
      # runs only where the script is committed executable (git mode 100755)
      - if [ -x ./verify_build.sh ]; then ./verify_build.sh; else echo "no executable verify_build.sh - skipping"; fi
    environment:
      VALIDATOR: onchain/claim_validator

  - name: aiken-flux_mint_policy
    image: debian:bookworm-slim
    commands: *aiken
    environment:
      VALIDATOR: onchain/flux_mint_policy

  - name: aiken-quarantine_validator
    image: debian:bookworm-slim
    commands: *aiken
    environment:
      VALIDATOR: onchain/quarantine_validator

  - name: python
    image: nikolaik/python-nodejs:python3.11-nodejs20   # python+node so the HW interop gate actually runs (not skipped)
    commands:
      - python -m pip install --upgrade pip -q
      - pip install -q -e ".[dev]"
      - pip show pycardano | grep -E '^(Name|Version|Requires):'
      - pip show cbor2 | grep -E '^(Name|Version):'
      # pycardano is capped <0.19.0 to keep the broken cbor2pure transitive out;
      # fail loud if a resolver change brings it back.
      - if pip show cbor2pure >/dev/null 2>&1; then echo "ERROR cbor2pure present — pycardano cap regressed" >&2; exit 1; fi
      - pytest -q
